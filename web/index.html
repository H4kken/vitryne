<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>drape-spike viewer</title>
  <style>
    html, body { margin: 0; height: 100%; background: #16161a; color: #ddd; font: 13px/1.4 ui-monospace, monospace; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
    #hud { position: fixed; left: 12px; top: 10px; background: rgba(0,0,0,.55); padding: 8px 10px; border-radius: 6px; max-width: calc(100vw - 48px); }
    #hud select, #hud button { font: inherit; background: #2a2a30; color: #ddd; border: 1px solid #444; padding: 2px 6px; margin: 2px 4px 2px 0; }
    #hud button.on { background: #2d5; color: #000; }
    #status.err { color: #f66; }
    #report { display: none; }
  </style>
</head>
<body>
  <canvas id="gfx"></canvas>
  <div id="hud">
    <div>
      <select id="scene">
        <optgroup label="Garments (DXF-AAMA patterns)">
          <option value="garment-tshirt:5000">T-shirt 5k</option>
          <option value="garment-tshirt:10000" selected>T-shirt 10k</option>
          <option value="garment-tshirt:20000">T-shirt 20k</option>
          <option value="garment-trousers:5000">Trousers 5k</option>
          <option value="garment-trousers:10000">Trousers 10k</option>
          <option value="garment-trousers:20000">Trousers 20k</option>
          <option value="garment-hoodie:5000">Hoodie 5k</option>
          <option value="garment-hoodie:10000">Hoodie 10k</option>
          <option value="garment-hoodie:20000">Hoodie 20k</option>
        </optgroup>
        <optgroup label="Spike scenes">
          <option value="tshirt:0.0122">Procedural T-shirt 5k</option>
          <option value="tshirt:0.00864">Procedural T-shirt 10k</option>
          <option value="tshirt:0.0061">Procedural T-shirt 20k</option>
          <option value="tshirt:0.00432">Procedural T-shirt 40k</option>
          <option value="sheet:100">Sheet 10k</option>
          <option value="sheet:100:nopins">Sheet 10k dropped (folds)</option>
        </optgroup>
      </select>
      <label title="C: reloads the scene"><input id="selfc" type="checkbox" checked /> self-collision</label>
      <button id="fast" title="F">fast drape</button>
      <button id="pause" title="space">pause</button>
      <button id="reset" title="R">reset</button>
    </div>
    <div id="stats">loading…</div>
    <div>drag the cloth to pull it · drag elsewhere to orbit · wheel to zoom</div>
    <p id="status">loading…</p>
  </div>
  <pre id="report"></pre>
  <script type="module" src="/viewer.js"></script>
</body>
</html>
