[workspace]
resolver = "3"
members = ["crates/drape-core", "crates/drape-assets", "crates/drape-native", "crates/drape-web"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
drape-core = { path = "crates/drape-core" }
drape-assets = { path = "crates/drape-assets" }
wgpu = { version = "30.0.1", default-features = false }
glam = { version = "0.34.1", features = ["bytemuck"] }
bytemuck = { version = "1.25", features = ["derive"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = 1

[profile.release-wasm]
inherits = "release"
debug = 0
opt-level = 3
