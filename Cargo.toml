[workspace]
resolver = "3"
members = [
    "crates/drape-core",
    "crates/drape-assets",
    "crates/drape-render",
    "crates/drape-native",
    "crates/drape-web",
    "crates/vitryne-format",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
vitryne-solver = { path = "crates/drape-core" }
vitryne-pattern = { path = "crates/drape-assets" }
vitryne-render = { path = "crates/drape-render" }
vitryne-format = { path = "crates/vitryne-format" }
wgpu = { version = "30.0.1", default-features = false }
glam = { version = "0.34.1", features = ["bytemuck"] }
bytemuck = { version = "1.25", features = ["derive"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = 1

[profile.release-wasm]
inherits = "release"
debug = 0
opt-level = 3
