# SPDX-License-Identifier: AGPL-3.0-or-later
# Every pull request and every push to main: `make check-ci`, which is `make check` without the
# golden drapes (GitHub's runners have no GPU; run `make regress` locally), and on pull requests
# the DCO sign-off of each commit. Both are required to merge (packages/vitryne-docs/content/docs/developers/maintaining.md).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: make check-ci

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - run: tools/check/dco.sh "$BASE" "$HEAD"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
