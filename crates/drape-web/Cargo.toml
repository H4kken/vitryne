[package]
name = "drape-web"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
drape-core.workspace = true
drape-render.workspace = true
drape-assets.workspace = true
vitryne-format.workspace = true
wgpu.workspace = true
glam.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
web-time = "1.1"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
console_log = "1"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Element", "OffscreenCanvas"] }
