[package]
name = "drape-core"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
wgpu = { workspace = true, features = ["wgsl", "std"] }
glam.workspace = true
bytemuck.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true

# Native: Metal/Vulkan/DX12 only. Web: WebGPU backend only (no WebGL fallback, hard rule 3).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { workspace = true, features = ["wgsl", "std", "metal", "vulkan", "dx12"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["wgsl", "std", "webgpu"] }
