# Vitryne, plug and go (docs/CLOUD.md):
#
#   docker compose -f deploy/docker-compose.yml up -d --build      then open http://localhost:8000
#
# Builds the editor from this checkout and serves it. With no settings it runs in local mode (no
# accounts, nothing stored server-side). Set SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY (in
# deploy/.env, see .env.example) for accounts and cloud storage on a Supabase project. To
# update: `git pull`, then the same command.

name: vitryne

services:
  web:
    image: vitryne-web
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
      target: from-source
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8000}:80"
      - "${HTTPS_PORT:-8443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:-}
      OPERATOR_NAME: ${OPERATOR_NAME:-}
      OPERATOR_CONTACT: ${OPERATOR_CONTACT:-}
      OPERATOR_HOSTING: ${OPERATOR_HOSTING:-}
    # So SUPABASE_DB_URL can name a database on this host (host.docker.internal), on Linux too.
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - caddy-data:/data

volumes:
  caddy-data:
