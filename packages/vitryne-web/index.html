<!doctype html>
<!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/images/vitryne-logo-192.png" />
    <link rel="apple-touch-icon" href="/images/vitryne-logo-192.png" />
    <title>Vitryne: garment design in your browser</title>
    <meta
      name="description"
      content="Draw, sew, drape and export garments in a browser tab. Free and open source."
    />
    <!-- Link previews. Crawlers need an absolute image URL: the hosted copy serves it for every
         install, and there is no og:url so self-hosted copies keep their own address. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vitryne" />
    <meta
      property="og:title"
      content="Vitryne: garment design in your browser"
    />
    <meta
      property="og:description"
      content="Draw, sew, drape and export garments in a browser tab. Free and open source."
    />
    <meta
      property="og:image"
      content="https://vitryne.app/images/og-preview.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A T-shirt draped on an avatar in the Vitryne editor"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
